name: kw-mobile-library-release
run-name: kw-mobile-library-release ${{ github.ref_name }}
# Full release on a version tag: verify the tag, check, sign, publish to Maven Central
# (automatic), wait until the artifacts resolve, then create the GitHub Release.
#   1. set version=X.Y.Z in gradle.properties and merge to main
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
# Secrets: GPG_PRIVATE_KEY, GPG_PASSPHRASE, CENTRAL_TOKEN_USERNAME, CENTRAL_TOKEN_PASSWORD (RELEASING.md).
'on':
  push:
    tags:
      - 'v*'

concurrency:
  group: kw-mobile-library-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Tag must match gradle.properties
        id: version
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version=$version in gradle.properties"
            exit 1
          fi
          case "$version" in *-SNAPSHOT) echo "::error::Refusing to release a SNAPSHOT"; exit 1;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70  # v3.5.0

      # Format, ErrorProne and Checker Framework. The live-sandbox tests run on every push to
      # main (kw-mobile-library-checks); a third-party sandbox outage must not block a release.
      - name: Format
        run: ./gradlew spotlessCheck -Denable.spotless=true
      - name: ErrorProne
        run: ./gradlew clean testClasses -Dbuild.errorprone=true
      - name: Checker Framework
        run: ./gradlew clean testClasses -Dbuild.checker=true

      # Re-running a tag (or tagging a version published by hand) must not fail: Central
      # rejects a version that already exists, so skip the upload and still make the release.
      - name: Already on Maven Central?
        id: central
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          url="https://repo1.maven.org/maven2/com/kwawingu/kw-mpesa-payment-impl/$VERSION/kw-mpesa-payment-impl-$VERSION.pom"
          if curl -fsI "$url" >/dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; echo "$VERSION is already published"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build jars for the GitHub Release (already published)
        if: steps.central.outputs.exists == 'true'
        run: ./gradlew clean assemble

      - name: Publish to Maven Central
        if: steps.central.outputs.exists != 'true'
        run: ./gradlew clean publishAggregationToCentralPortal
        env:
          CENTRAL_PUBLISHING_TYPE: AUTOMATIC
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}

      - name: Wait until Maven Central serves the release
        if: steps.central.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          url="https://repo1.maven.org/maven2/com/kwawingu/kw-mpesa-payment-impl/$VERSION/kw-mpesa-payment-impl-$VERSION.pom"
          for i in $(seq 1 60); do
            if curl -fsI "$url" >/dev/null; then echo "Available: $url"; exit 0; fi
            sleep 30
          done
          echo "::warning::Published, but $url was not reachable after 30 minutes (Central sync can lag)."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          generate_release_notes: true
          files: |
            kw-*/build/libs/*-${{ steps.version.outputs.version }}.jar
            kw-*/build/libs/*-${{ steps.version.outputs.version }}-sources.jar
            kw-*/build/libs/*-${{ steps.version.outputs.version }}-javadoc.jar
