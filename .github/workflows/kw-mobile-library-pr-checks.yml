name: kw-mobile-library-pr-checks
run-name: kw-mobile-library-pr-checks
'on':
  issue_comment:
    types: [created]

jobs:
  install-and-cache-deps:
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request && github.event.comment.body == '/test'
    timeout-minutes: 20
    steps:
      - name: Get Pull Request (PR) Branch
        uses: xt0rted/pull-request-comment-branch@v2
        id: comment-branch
      - name: Checkout Pull Request (PR) Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.comment-branch.outputs.head_ref }}
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

  library-format-static-analysis-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: install-and-cache-deps
    if: github.event.issue.pull_request && github.event.comment.body == '/test'
    steps:
      - name: Get Pull Request (PR) Branch
        uses: xt0rted/pull-request-comment-branch@v2
        id: comment-branch
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.comment-branch.outputs.head_ref }}
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true
      - name: Run Gradle targets for the Library tasks
        run: ./scripts/ci/kw-mobile-lib-format-static-analysis-unit-test.sh
        env:
          SNIPPE_API_KEY: ${{ secrets.SNIPPE_API_KEY }}
