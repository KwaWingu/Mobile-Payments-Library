name: kw-mobile-library-dependency-check
run-name: kw-mobile-library-dependency-check
# OWASP dependency-check runs off the PR critical path: NVD scans are slow and occasionally
# flaky, so gating every PR on them is impractical. Weekly schedule + manual dispatch instead.
'on':
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: kw-mobile-library-dependency-check
  cancel-in-progress: true

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70  # v3.5.0
      - name: OWASP dependency-check
        run: ./gradlew dependencyCheckAnalyze -Denable.owasp=true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dependency-check-reports
          path: '**/build/reports/dependency-check-report.*'
