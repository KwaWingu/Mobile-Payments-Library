name: kw-mobile-library-dependency-check
run-name: kw-mobile-library-dependency-check
# OWASP dependency-check runs off the PR critical path: NVD scans are slow and occasionally
# flaky, so gating every PR on them is impractical. Weekly schedule + manual dispatch instead.
'on':
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: kw-mobile-library-dependency-check
  cancel-in-progress: true

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: OWASP dependency-check
        run: ./gradlew dependencyCheckAnalyze -Denable.owasp=true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: '**/build/reports/dependency-check-report.*'
