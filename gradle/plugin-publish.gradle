apply plugin: 'maven-publish'
apply plugin: 'signing'

java {
    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = project.name
                description = "KwaWingu Mobile Payments Library - ${project.name}"
                url = 'https://github.com/KwaWingu/Mobile-Payments-Library'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0'
                    }
                }
                developers {
                    developer {
                        id = 'kwawingu'
                        name = 'KwaWingu'
                        email = 'dev@kwawingu.com'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/KwaWingu/Mobile-Payments-Library.git'
                    developerConnection = 'scm:git:git@github.com:KwaWingu/Mobile-Payments-Library.git'
                    url = 'https://github.com/KwaWingu/Mobile-Payments-Library'
                }
            }
        }
    }
}

def signingKey = findProperty("signingKey") as String
def signingPassword = findProperty("signingPassword") as String
signing {
    // Fail the build when publishing to a remote repository without a signing key, instead of
    // silently uploading unsigned artifacts that the Central Portal will reject. Local
    // publishToMavenLocal stays unsigned so day-to-day development does not need a GPG key.
    required = {
        gradle.taskGraph.allTasks.any { task ->
            task.name.contains('publishAggregation') ||
                (task.name.startsWith('publish') && !task.name.contains('MavenLocal'))
        }
    }
    if (signingKey) {
        useInMemoryPgpKeys(signingKey, signingPassword)
    }
    sign publishing.publications.mavenJava
}
