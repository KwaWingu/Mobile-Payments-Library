plugins {
    id 'com.gradleup.nmcp.settings' version '1.5.0'
}

nmcpSettings {
    centralPortal {
        username = System.getenv('CENTRAL_TOKEN_USERNAME') ?: ''
        password = System.getenv('CENTRAL_TOKEN_PASSWORD') ?: ''
        // Local runs default to USER_MANAGED (a human clicks "Publish" in the Central Portal).
        // The tag-triggered release workflow sets CENTRAL_PUBLISHING_TYPE=AUTOMATIC after checking
        // that the tag matches gradle.properties, so a release needs no manual step.
        publishingType = System.getenv('CENTRAL_PUBLISHING_TYPE') ?: 'USER_MANAGED'
    }
}

rootProject.name = 'mobile-payments-library'

include('kw-mobile-payment-logback-config')
include('kw-mobile-payment-client')
include('kw-mpesa-payment-api')
include('kw-mpesa-payment-impl')
include('kw-airtel-payment-api')
include('kw-airtel-payment-impl')
include('kw-halopesa-payment-api')
include('kw-halopesa-payment-impl')
include('kw-mixxbyyas-payment-api')
include('kw-mixxbyyas-payment-impl')
